envelope:
  field: result.code
  description_field: result.description
  note: >-
    Buyer-facing declines and risk rejections on the ACI Open Payment Platform.
    A decline is signalled by the result.code group (not a separate field). The
    issuer often returns a generic "declined for unknown reason" (800.100.100)
    to avoid disclosing detail to the shopper; more specific reasons (invalid
    card, stolen card, insufficient funds) are surfaced where the issuer permits.
    Complements the full result-code catalog in
    errors/aci-worldwide-result-codes.yml.
