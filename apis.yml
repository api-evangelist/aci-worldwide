apis:
- aid: aci-worldwide:open-payment-platform-server-to-server
  name: ACI Open Payment Platform — Server-to-Server API
  description: >-
    The core RESTful payment API of the ACI Open Payment Platform (PAY.ON
    gateway). Server-to-Server integration lets merchants and PSPs run end-to-end
    payment workflows — preauthorization, debit, capture, refund, and reversal —
    across cards and alternative payment methods. Requests are authenticated with
    an Authorization Bearer access token plus a channel entityId. Production host
    is https://eu-prod.oppwa.com and test host is https://eu-test.oppwa.com.
  humanURL: https://docs.aciworldwide.com/integrations/server-to-server
  baseURL: https://eu-prod.oppwa.com
  tags:
  - Payments
  - Server-to-Server
  - Card Payments
  - REST
  tags_raw:
  - Payments
  - Server to Server
  - Card Payments
  - REST
  properties:
  - type: Documentation
    url: https://docs.aciworldwide.com/integrations/server-to-server
  - type: APIReference
    url: https://docs.aciworldwide.com/reference/parameters
  - type: GettingStarted
    url: https://docs.aciworldwide.com/integrations/widget
- aid: aci-worldwide:copyandpay
  name: ACI COPYandPAY
  description: >-
    COPYandPAY is ACI's secure, PCI-friendly embedded payments widget for
    merchants and integrators. It renders a hosted card and alternative-payment
    form that tokenizes and submits sensitive data directly to the Open Payment
    Platform, reducing the merchant's PCI scope while running on the same
    oppwa.com gateway and access-token/entityId authentication as the
    Server-to-Server API.
  humanURL: https://docs.aciworldwide.com/integrations/widget
  baseURL: https://eu-prod.oppwa.com
  tags:
  - Payments
  - Embedded Checkout
  - PCI
  - E-Commerce
  tags_raw:
  - Payments
  - Embedded Checkout
  - PCI
  - eCommerce
  properties:
  - type: Documentation
    url: https://docs.aciworldwide.com/integrations/widget
  - type: APIReference
    url: https://docs.aciworldwide.com/reference/parameters
  - type: Components
    url: components/aci-worldwide-components.yml
- aid: aci-worldwide:backoffice
  name: ACI BackOffice API
  description: >-
    BackOffice operations on the Open Payment Platform let integrators process
    and manage previously authorized transactions — captures, refunds,
    reversals, and related post-authorization actions — via the same RESTful
    oppwa.com gateway and bearer-token/entityId authentication.
  humanURL: https://docs.aciworldwide.com/integrations/backoffice
  baseURL: https://eu-prod.oppwa.com
  tags:
  - Payments
  - Refunds
  - Transaction Management
  properties:
  - type: Documentation
    url: https://docs.aciworldwide.com/integrations/backoffice
  - type: APIReference
    url: https://docs.aciworldwide.com/reference/parameters
- aid: aci-worldwide:pay-by-link
  name: ACI Pay By Link API
  description: >-
    Pay By Link lets merchants create secure, customizable hosted payment link
    pages and collect payments without a full checkout integration, built on the
    Open Payment Platform gateway.
  humanURL: https://docs.aciworldwide.com/integrations/paybylink
  baseURL: https://eu-prod.oppwa.com
  tags:
  - Payments
