name: ACI Worldwide
kind: company
description: >-
  ACI Worldwide (NASDAQ: ACIW) is a US-headquartered payment-software company
  that builds real-time payment, card, merchant/eCommerce, and bill-payment
  technology for banks, processors, merchants, and billers around the world. Its
  enterprise portfolio spans BASE24 card and ATM switching, the ACI Enterprise
  Payments Platform for real-time and ISO 20022 account-to-account rails, and ACI
  Speedpay bill payment — most of which ship as licensed, on-premise or hosted
  software rather than public self-serve APIs. ACI's genuinely API-native surface
  is the ACI Open Payment Platform (the PAY.ON global payment gateway): a unified
  RESTful API documented at docs.aciworldwide.com that lets merchants and PSPs
  accept and manage card and alternative-payment transactions through
  Server-to-Server, COPYandPAY, Mobile SDK, BackOffice, and Pay By Link
  integrations, authenticated with an Authorization Bearer access token plus a
  channel entityId and complemented by PAYMENT and REGISTRATION webhook
  notifications. Its home market is the United States, inside the deep,
  fragmented, API-native US payments landscape.
