    url: https://docs.aciworldwide.com/integrations/paybylink
  - type: APIReference
    url: https://docs.aciworldwide.com/reference/parameters
- aid: aci-worldwide:mobile-sdk
  name: ACI Mobile SDK
  description: >-
    The ACI Mobile SDK lets developers accept payments inside native mobile apps,
    wrapping the Open Payment Platform's card and alternative-payment flows with
    device-side tokenization and 3-D Secure support against the same oppwa.com
    gateway.
  humanURL: https://docs.aciworldwide.com/integrations/mobile-sdk
